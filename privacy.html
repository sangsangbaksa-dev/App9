<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터와 개인정보</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body><main class="wrap"><article class="card"><h1>데이터와 개인정보</h1>
<p>입력한 내용은 사용 중인 브라우저의 저장소에 보관됩니다. 이 앱에서 계정을 만들거나 입력 내용을 운영자에게 전송하는 기능은 없습니다.</p>
<p>브라우저 데이터를 지우거나 기기를 바꾸면 기록에 접근할 수 없을 수 있습니다. 앱에서 백업 파일을 내려받아 안전한 장소에 보관하세요. 백업 파일을 가진 사람은 그 내용을 읽을 수 있습니다.</p>
<p>웹페이지를 열 때 호스팅 제공자에게 접속 요청이 전달됩니다. 접속 기록의 처리 여부와 보관 기간은 실제 사용하는 호스팅 서비스의 설정과 정책에 따릅니다.</p>
